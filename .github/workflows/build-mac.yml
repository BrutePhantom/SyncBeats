name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'syncbeats-desktop/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    name: Build macOS DMG Package
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: syncbeats-desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd syncbeats-desktop
          npm ci

      - name: Build DMG with Electron Builder
        run: |
          cd syncbeats-desktop
          npm run build:mac

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncbeats-desktop-1.0.0-mac-dmg
          path: syncbeats-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
